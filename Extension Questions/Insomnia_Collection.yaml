    meta:
      id: req_e4a1082412ec4d63ac173e15117a1967
      created: 1773768049296
      modified: 1773769544191
      isPrivate: false
      description: >-
        Question 3: Repeat #2 with additional conditions: query 100 pools with
        the highest liquidity that were created in the past week



        Date when creating this: 18th March 2026, we need to find timestamp from
        one week ago


        One week ago timestamp: 1773190800


        GMT: Wednesday, March 11, 2026 at 1:00:00 AM

        Your time zone: Wednesday, March 11, 2026 at 9:00:00 AM GMT+08:00

        Relative: 7 days ago
      sortKey: -1773768049371
    method: POST
    body:
      mimeType: application/graphql
      text: '{"query":"query GetTop100HighestLiquidityPools {\n  pools(\n    first:
        100\n    orderBy: liquidity\n    orderDirection: desc\n    where:
        {createdAtTimestamp_gte: \"1773190800\"}\n  ) {\n    id\n    token0
        {\n      id\n      symbol\n    }\n    token1
        {\n      id\n      symbol\n    }\n  }\n}","operationName":"GetTop100HighestLiquidityPools"}'
    headers:
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
      - name: Content-Type
        value: application/json
